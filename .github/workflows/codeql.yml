name: CodeQL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive   # translations live in the l10n submodule

    - name: Analyze code with CodeQL
      uses: github/codeql-action/analyze@v4.37.9
      with:
        category: "security"